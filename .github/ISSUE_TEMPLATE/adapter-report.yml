name: アダプターの動作報告
description: 接続できたアダプターの UUID を教えてください（アプリの「UUID 管理」や「設定」の「このアダプターの動作を報告」から開くと、UUID が自動で入ります）
title: "[アダプター] "
labels: ["adapter-report"]
body:
  - type: markdown
    attributes:
      value: |
        ご協力ありがとうございます。内容を確認後、アプリの「既知の UUID」に登録します。
        使っていて困ったことがある場合は、「不具合の報告」からお知らせください。
  - type: input
    id: product
    attributes:
      label: 製品名（任意）
      description: 分かる場合だけ。製品名がないアダプターは空欄で構いません
      placeholder: 例）JFIND JF327
  - type: input
    id: uuid
    attributes:
      label: サービス UUID
      description: Stethos の「UUID 管理」画面や nRF Connect で確認できます
      placeholder: 例）FFF0 または e7810a71-73ae-499d-8c15-faa9aef0c3f2
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 動作結果
      options:
        - 問題なく使えた
        - 接続はできたがデータが取れない
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: その他（任意）
